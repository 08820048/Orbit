<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Flat, no gradients: depth comes from stacked solid tones. macOS icon grid: 824 pt shape inside the 1024 canvas. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".4"/></filter>
    <clipPath id="tile"><rect width="100" height="100" rx="22.4"/></clipPath>
    <clipPath id="ball"><circle cx="50" cy="52" r="22"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184.6" fill="#000" filter="url(#shadow)"/>
  <g transform="translate(100 100) scale(8.24)">
    <rect width="100" height="100" rx="22.4" fill="#0C1A3D"/>
    <!-- a big faint orbit behind everything -->
    <g clip-path="url(#tile)"><ellipse cx="50" cy="52" rx="62" ry="24" transform="rotate(-26 50 52)" fill="none" stroke="#1B3170" stroke-width="1.4"/></g>
    <!-- ring, back half -->
    <g transform="translate(50 52) rotate(-26)"><path d="M-42 0A42 14.5 0 0 1 42 0" fill="none" stroke="#9CC0FF" stroke-width="3.6"/></g>
    <!-- planet: three flat tones -->
    <circle cx="50" cy="52" r="22" fill="#3B82F6"/>
    <g clip-path="url(#ball)">
      <path fill-rule="evenodd" fill="#1F5FDB" d="M20 22H80V82H20Z M44 46m-22 0a22 22 0 1 0 44 0a22 22 0 1 0-44 0"/>
      <ellipse cx="41" cy="43" rx="9" ry="5.2" transform="rotate(-26 41 43)" fill="#7FB0FF"/>
      <!-- the ring's shadow on the planet -->
      <g transform="translate(50 56) rotate(-26)"><path d="M-42 0A42 14.5 0 0 0 42 0" fill="none" stroke="#173F9C" stroke-width="5.2"/></g>
    </g>
    <!-- ring, front half -->
    <g transform="translate(50 52) rotate(-26)"><path d="M-42 0A42 14.5 0 0 0 42 0" fill="none" stroke="#F2F7FF" stroke-width="3.6"/></g>
    <!-- moon -->
    <g transform="translate(50 52) rotate(-26)"><circle cx="24" cy="12" r="4.4" fill="#0C1A3D"/><circle cx="24" cy="12" r="3" fill="#FFFFFF"/></g>
  </g>
</svg>
